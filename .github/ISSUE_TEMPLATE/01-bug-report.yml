name: Bug report
description: Tell us about something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide enough detail for us to reproduce it.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that consistently reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your browser, operating system, and any relevant version information.
      placeholder: |
        - OS:
        - Browser:
        - App version or commit:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or additional context
      description: Do not include passwords, tokens, or other sensitive information.
    validations:
      required: false
